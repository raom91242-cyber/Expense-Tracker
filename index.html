<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <title>Expense Tracker</title>
</head>

<body class="container mt-5">

    <h2 class="text-center mb-4">Expense Tracker</h2>

    <form action="" id="expenseForm" class="row g-2 mb-4">

        <div class="col-md-2">
            <input type="number" id="amount" class="form-control" placeholder="Amount" min="0.01" step="0.01" required>
        </div>

        <div class="col-md-3">
            <input type="text" id="description" class="form-control" placeholder="Description" required>
        </div>

        <div class="col-md-3">
            <select id="category" class="form-select" required>

                <option value="">Select category</option>
                <option value="Movie">Movie</option>
                <option value="Fun">Fun</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Study">Study</option>
                <option value="Home">Home</option>
            </select>
        </div>

        <div class="col-md-2">
            <button id="submitBtn" class="btn btn-primary w-100">
                Add Expense
            </button>
        </div>
    </form>

    <h4 class="mb-3">Your Expenses</h4>

    <ul id="expenseList" class="list-group">

    </ul>

    <script src="script.js"></script>




</body>

</html>
